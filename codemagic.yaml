workflows:
  ios-adhoc:
    name: TmanVibez iOS Ad Hoc
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.wiantribe.tmanvibez
      vars:
        XCODE_PROJECT: TmanVibez.xcodeproj
        XCODE_SCHEME: TmanVibez
      xcode: latest
    scripts:
      - name: Apply iOS signing profiles
        script: xcode-project use-profiles
      - name: Build signed iPhone IPA
        script: |
          xcode-project build-ipa --project "$CM_BUILD_DIR/$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
